<!DOCTYPE html>
<html lang="en">
<head>
    <title>Input Types</title>
</head>
<body>
    <form>
        <h1>Input type example</h1>
        <lable>enter your name</lable>
        <input type="enter your name" placeholder="enter your name"/><br><br>
        <label>enter your email</label>
        <input type="enter your email" placeholder="enter your email"/><br><br>
        <label>phone number</label>
        <input type="number" placeholder="enter your number"/><br><br>
        <label>enter your password</label>
        <input type="password" placeholder="enter password"/><br><br>
        <label>enter your birtdate</label>
        <input type="date" placeholder="enter your birtdate"/><br><br>
        <label>enter month</label>
        <input type="month"/><br><br>
        <lable>enter week</lable>
        <input type="week"/><br><br>
        <lable>enter your time</lable>
        <input type="time"/>
        <lable>enter your date time</lable>
        <input type="datetime-local"/><br><br>
        <lable>select rang</lable>
        <input type="range"/><br><br>
        <lable>choose city</lable>
        <input type="checkbox"checked/>Pune
        <input type="checkbox"/>Mumbai
        <input type="checkbox"/>Nashik
        <input type="checkbox"/>kolhapur<br><br>

        <lable>Select Gender</lable>
        <input type="radio" name="gender"/>male
        <input type="radio" name="gender"/>female
        <input type="radio" name="gender"/>others<br><br>

        <lable>Upload document</lable>
        <input type="file" multiple/>
        <label>select youe fev colour</label>
        <input type="color"/><br><br>

        <label>select your fev dish</label>
        <select>
            <option>choose..</option>
            <option>pavbhaji</option>
            <option>manchurian</option>
            <option>misal</option>
            <option>biryani</option>
        </select><br><br>
        <label>enter address</label>
        <textarea rows="2" cols="10"></textarea><br><br>
        <input type="submit" value="sumbit"/>
        <input type="button" value="sumbit"/>
        <input type="reset" value="reset"/>
        <label></label>
    </form>
</body>
</html>
